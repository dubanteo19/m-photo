# Database Strategy for Development
#quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.jackson.fail-on-empty-beans=false
quarkus.hibernate-orm.mapping.format.global=ignore
# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=mphoto
quarkus.datasource.password=password
quarkus.datasource.reactive.url=postgresql://localhost:5432/mphoto
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
#quarkus.minio.host=minio.dbt19.site
quarkus.minio.host=192.168.20.5
#quarkus.minio.port=443
quarkus.minio.port=9000
quarkus.minio.access-key=admin
quarkus.minio.secret-key=password
quarkus.minio.secure=false
# RSA Key Locations
smallrye.jwt.sign.key.location=classpath:privateKey.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem
# JWT Configuration
mp.jwt.verify.issuer=https://dbt19.site
smallrye.jwt.expiration.grace-period=60
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=m_user
quarkus.http.auth.permission.public.paths=/auth/login,/auth/register,/public/*,/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# quarkus.log.category."io.quarkus.security".level=TRACE
# quarkus.log.category."io.quarkus.vertx.http.runtime.security".level=TRACE
# quarkus.log.category."io.smallrye.jwt".level=TRACE
# quarkus.log.console.level=TRACE
# Enable/Disable Quarkus cache globally (defaults to true)
quarkus.cache.enabled=true
# Global eviction defaults for ALL Caffeine caches
quarkus.cache.caffeine.initial-capacity=100
quarkus.cache.caffeine.maximum-size=10000
quarkus.cache.caffeine.expire-after-write=PT1H
# Photo Upload Configuration
# Maximum upload size in bytes (50 MB)
photo.upload.max-size=52428800
app.bucket=mphoto-public